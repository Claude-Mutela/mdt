# ── 1. Bloc Catch-All : rejet immédiat des requêtes sur domaines pirates / non autorisés / IP ──
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444; # Fermeture de connexion immédiate sans réponse HTTP (Protection contre usurpation SEO)
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/philamdt.church/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philamdt.church/privkey.pem;

    return 444;
}

# ── 2. Redirection HTTP (80) -> HTTPS Canonique (philamdt.church) ──
server {
    listen 80;
    server_name philamdt.church www.philamdt.church;

    return 301 https://philamdt.church$request_uri;
}

# ── 3. Redirection HTTPS WWW -> HTTPS Apex Canonique (www.philamdt.church -> philamdt.church) ──
server {
    listen 443 ssl;
    server_name www.philamdt.church;

    ssl_certificate     /etc/letsencrypt/live/philamdt.church/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philamdt.church/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://philamdt.church$request_uri;
}

# ── 4. Serveur Principal HTTPS (philamdt.church) ──
server {
    listen 443 ssl;
    server_name philamdt.church;

    # ── SSL (Let's Encrypt via Certbot) ───────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/philamdt.church/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philamdt.church/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ───────────────────────────────────────────────────
    add_header X-Frame-Options         "DENY"                always;
    add_header X-Content-Type-Options  "nosniff"             always;
    add_header X-XSS-Protection        "1; mode=block"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ── Assets statiques (Vite) ────────────────────────────────────────────────
    location /assets/ {
        alias /var/www/philamdt/build/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers publics ───────────────────────────────────────────────────────
    location /public/ {
        alias /var/www/philamdt/build/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Proxy vers l'application AdonisJS (PM2) ───────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;

        # Taille maximale des uploads
        client_max_body_size 50M;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3333/health;
        access_log off;
    }

    # ── Fichiers cachés ────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
